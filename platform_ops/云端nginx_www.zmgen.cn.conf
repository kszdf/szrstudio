# ============================================================
# 慧根堂工作台对外域名配置 - www.zmgen.cn -> 本地 8385 工作台
# 放置位置: 云端服务器 /etc/nginx/sites-available/www.zmgen.cn
# 启用: ln -s /etc/nginx/sites-available/www.zmgen.cn /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx
# 前提: frp 隧道 studio-8385 已把 云端:8385 转发到 本机工作台(8385)（已就绪）
# ============================================================

# --- HTTP 跳转 HTTPS ---
server {
    listen 80;
    server_name www.zmgen.cn;
    return 301 https://$host$request_uri;
}

# --- HTTPS 主站: 慧根堂工作台 ---
server {
    listen 443 ssl http2;
    server_name www.zmgen.cn;

    # 证书: 先执行 certbot 把 www.zmgen.cn 并入现有 zmgen.cn 证书
    #   certbot certonly --nginx -d zmgen.cn -d www.zmgen.cn
    ssl_certificate     /etc/letsencrypt/live/zmgen.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zmgen.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 200m;   # 上传模特/背景图可能较大

    location / {
        proxy_pass http://127.0.0.1:8385;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
